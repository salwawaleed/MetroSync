<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetroSync Admin Panel</title>
<style>
body{font-family:system-ui,sans-serif;background:#f7f9ff;color:#1d2939;margin:0}
header{background:#fff;border-bottom:1px solid #dbe3ef;padding:18px 7%;display:flex;justify-content:space-between}
h1{color:#1769e0;margin:0}.wrap{max-width:600px;margin:35px auto;padding:0 20px}
.card{background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:24px;margin-bottom:18px}
h2{margin-top:0}input,select,textarea{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#1769e0;color:white;font-weight:700;cursor:pointer}.msg{margin-top:10px;padding:10px;border-radius:8px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header><h1>MetroSync Admin</h1><span>Live Announcements</span></header>
<div class="wrap">
<section class="card" id="loginCard">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="admin@metro.local" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginButton">Sign In</button><div id="loginMsg"></div>
</section>
<section class="card" id="postCard" style="display:none">
<h2>Post Announcement</h2>
<select id="station"><option value="">Select station...</option></select>
<p>Passengers watching: <b id="viewerCount">0</b></p>
<textarea id="text" rows="5" maxlength="500" placeholder="Service update at Central Station..."></textarea>
<button id="publishButton">Publish</button><div id="postMsg"></div>
</section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let token='';
const station=document.getElementById('station');

async function login(){
  try{
    const response=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const body=await response.json();
    if(!response.ok)throw Error(body.message||'Login failed');
    token=body.token;
    document.getElementById('loginCard').style.display='none';
    document.getElementById('postCard').style.display='block';
    await loadStations();
  }catch(error){show('loginMsg',error.message,false)}
}

async function loadStations(){
  const response=await fetch('/api/v1/stations');
  const body=await response.json();
  (body.data||[]).forEach(s=>{
    const option=document.createElement('option');option.value=s._id;option.textContent=`${s.name} — ${s.line}`;station.appendChild(option);
  });
}

station.onchange=()=>{
  document.getElementById('viewerCount').textContent='0';
  if(station.value)socket.emit('watchPresence',station.value);
};

socket.on('presenceUpdate',payload=>{
  if(String(payload.stationId)===String(station.value))document.getElementById('viewerCount').textContent=payload.count;
});

async function publish(){
  try{
    const id=station.value;
    if(!id)throw Error('Select a station');
    const response=await fetch(`/api/v1/stations/${id}/announcements`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({text:document.getElementById('text').value})});
    const body=await response.json();
    if(!response.ok)throw Error(body.message||'Failed to publish');
    show('postMsg','Announcement published.',true);
    document.getElementById('text').value='';
  }catch(error){show('postMsg',error.message,false)}
}
function show(id,text,ok){const element=document.getElementById(id);element.className=`msg ${ok?'ok':'err'}`;element.textContent=text;}
document.getElementById('loginButton').onclick=login;
document.getElementById('publishButton').onclick=publish;
</script>
</body>
</html>
